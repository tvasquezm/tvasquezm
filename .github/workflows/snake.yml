name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"  # se actualiza automáticamente todos los días a medianoche UTC
  workflow_dispatch:      # permite ejecutarlo manualmente desde la pestaña "Actions"
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generar imagen de la serpiente
        uses: Platane/snk@v3
        with:
          github_user_name: tvasquezm
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Subir a la rama "output"
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
